name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version matching package.json and its existing tag'
        type: string
        required: true
      expected_sha:
        description: 'Reviewed main HEAD (full 40-character commit SHA)'
        type: string
        required: true
      publish:
        description: 'Publish verified DMGs and update Homebrew (false still signs and notarizes)'
        type: boolean
        default: false
        required: true
      include_windows:
        description: 'Build and verify Windows from the same commit and publish both OS together'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main' && inputs.include_windows
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  release:
    needs: windows
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && ((inputs.include_windows && needs.windows.result == 'success') || (!inputs.include_windows && needs.windows.result == 'skipped')) }}
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate new release and exact main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          node scripts/macos/release-guard.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows candidate from this run
        if: inputs.include_windows
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/windows

      - name: Verify exact Windows release identity
        if: inputs.include_windows
        run: node scripts/windows/release-evidence.mjs

      - name: Security audit
        run: pnpm audit && pnpm audit --prod

      - name: Quality gates
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc -p electron/tsconfig.json
          pnpm run lint
          pnpm run check:architecture
          pnpm run check:design-system
          # Vitest + MUI module transforms can exceed the macOS runner default.
          ulimit -n 10240
          pnpm run test:ci
          pnpm run check:adr

      - name: Build Storybook
        run: pnpm run build:storybook

      - name: Build React app
        run: pnpm run build

      - name: Build Electron TypeScript
        run: pnpm run build:electron-main

      - name: Bundle and verify preload
        run: pnpm run bundle:preload && pnpm run check:preload

      - name: Build verified media tools
        run: pnpm run media:build:all-mac

      - name: Run Electron E2E
        env:
          E2E_LLAMA_MODEL: .cache/testing/qwen-test.gguf
        run: |
          pnpm run llama:prepare:mac
          node scripts/prepare-test-model.mjs
          pnpm run test:e2e

      - name: Package signed and notarized macOS DMGs
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing existing secret: $key"
              exit 1
            fi
          done
          pnpm exec electron-builder --mac --x64 --publish never -c.forceCodeSigning=true -c.mac.notarize=true -c.afterPack=./scripts/macos/after-pack.mjs
          pnpm exec electron-builder --mac --arm64 --publish never -c.forceCodeSigning=true -c.mac.notarize=true -c.afterPack=./scripts/macos/after-pack.mjs

      - name: Verify actual apps inside the final DMGs
        run: |
          node scripts/macos/verify-dmg.mjs "dist/SporTagLytics-$RELEASE_VERSION-x64.dmg" x64 dist/mac-verification/final-x64.json
          node scripts/macos/verify-dmg.mjs "dist/SporTagLytics-$RELEASE_VERSION-arm64.dmg" arm64 dist/mac-verification/final-arm64.json

      - name: Package macOS corresponding media sources
        run: node scripts/package-media-sources.mjs --platform macos --require-builds

      - name: Package Windows corresponding media sources
        if: inputs.include_windows
        run: node scripts/package-media-sources.mjs --platform windows --require-builds

      - name: Record exact release checksums
        working-directory: dist
        env:
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        run: |
          shasum -a 256 "SporTagLytics-$RELEASE_VERSION-arm64.dmg" "SporTagLytics-$RELEASE_VERSION-x64.dmg" "media-tools-sources-$RELEASE_VERSION-macos.tar.gz" > SHA256SUMS.txt
          if [[ "$INCLUDE_WINDOWS" == true ]]; then
            shasum -a 256 "SporTagLytics-Setup-$RELEASE_VERSION-x64.exe" "media-tools-sources-$RELEASE_VERSION-windows.tar.gz" >> SHA256SUMS.txt
          fi

      - name: Preserve verified candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ inputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/SporTagLytics-${{ inputs.version }}-arm64.dmg
            dist/SporTagLytics-${{ inputs.version }}-x64.dmg
            dist/media-tools-sources-${{ inputs.version }}-macos.tar.gz
            dist/SporTagLytics-Setup-${{ inputs.version }}-x64.exe
            dist/media-tools-sources-${{ inputs.version }}-windows.tar.gz
            dist/SHA256SUMS.txt
            dist/mac-verification/*.json
            dist/windows/distribution/windows-installed.json
            dist/windows-release.json
            dist/media-builds/win32-x64.json

      - name: Recheck identity before publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          node scripts/macos/release-guard.mjs
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Create immutable desktop release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        run: |
          assets=("dist/SporTagLytics-$RELEASE_VERSION-arm64.dmg" "dist/SporTagLytics-$RELEASE_VERSION-x64.dmg" "dist/media-tools-sources-$RELEASE_VERSION-macos.tar.gz" dist/SHA256SUMS.txt)
          platform='macOS'
          if [[ "$INCLUDE_WINDOWS" == true ]]; then
            node scripts/windows/release-evidence.mjs --verify-only
            assets+=("dist/SporTagLytics-Setup-$RELEASE_VERSION-x64.exe" "dist/media-tools-sources-$RELEASE_VERSION-windows.tar.gz")
            platform='macOS / Windows'
          fi
          node scripts/desktop-release-notes.mjs
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "v$RELEASE_VERSION ($platform)" --generate-notes \
            --notes-file dist/release-notes.md \
            "${assets[@]}"

      - name: Checkout Homebrew Tap using its existing token
        if: inputs.publish
        uses: actions/checkout@v4
        with:
          repository: Kou-ISK/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Tap after publication
        if: inputs.publish
        run: |
          node scripts/macos/write-cask.mjs
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Casks/sportaglytics.rb
          git -C homebrew-tap diff --staged --quiet || git -C homebrew-tap commit -m "chore(cask): update sportaglytics to v$RELEASE_VERSION"
          git -C homebrew-tap push
