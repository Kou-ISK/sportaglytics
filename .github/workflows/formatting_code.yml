name: quality-check

on:
  pull_request:
    branches: [main, develop, "feat**"]

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Inspect release diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest Release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'id\trun_number\tstatus\tconclusion\thead_sha\tcreated_at\tupdated_at\thtml_url'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&event=push&per_page=5" \
            --jq '.workflow_runs[] | [.id, .run_number, .status, .conclusion, .head_sha, .created_at, .updated_at, .html_url] | @tsv'

      - name: Inspect failed Release log
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view 32573060208 --repo "$GITHUB_REPOSITORY" --log-failed
