name: quality-check

on:
  pull_request:
    branches: [main, develop, "feat**"]
  workflow_dispatch:

jobs:
  check:
    name: Validate source code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck renderer
        run: pnpm run typecheck

      - name: Typecheck electron
        run: pnpm run typecheck:electron

      - name: Architecture check
        run: pnpm run check:architecture

      - name: ADR check
        run: pnpm run check:adr

      - name: Test
        run: pnpm run test:run

  clip-sync-e2e:
    name: Clip synchronization E2E
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run clip synchronization E2E
        run: pnpm run test:e2e:clip-sync
