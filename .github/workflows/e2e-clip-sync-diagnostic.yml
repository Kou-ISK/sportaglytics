name: e2e-clip-sync-diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  clip-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verified media tools
        run: pnpm run media:build:all-mac

      - name: Prepare Electron E2E
        run: pnpm run e2e:prepare

      - name: Run clip sync Electron E2E
        run: node scripts/e2e-clip-sync.mjs
