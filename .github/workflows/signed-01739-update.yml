name: Verify signed 0.17.36 to 0.17.39 document update
on:
  push:
    branches: [test/signed-01739-update-acceptance]
    paths:
      - .github/workflows/signed-01739-update.yml
      - scripts/verify-signed-01739-update.mjs
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: macos-latest
    timeout-minutes: 22
    env:
      EXPECTED_MAIN: f6684a4fe6da1ea48e92ed6341c808d2ba8de45f
      CANDIDATE_RUN: '45460499352'
      ARTIFACT_ID: '14957426495'
      ARCHIVE_SHA256: '0e09241fc0a1496aaf36d05360f2107307c171828722d531e2a6f083b4ee3316'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pin release run, immutable artifact ID and downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP"
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/actions/runs/$CANDIDATE_RUN" > signing-run.json
          jq -e --arg head "$EXPECTED_MAIN" '.conclusion=="success" and .path==".github/workflows/release.yml" and .head_branch=="main" and .head_sha==$head' signing-run.json
          gh api "$api/actions/artifacts/$ARTIFACT_ID" > candidate-artifact.json
          jq -e --arg name "macos-0.17.39-$EXPECTED_MAIN" --arg digest "sha256:$ARCHIVE_SHA256" --arg run "$CANDIDATE_RUN" '.name==$name and .expired==false and .digest==$digest and (.workflow_run.id|tostring)==$run' candidate-artifact.json
          gh api "$api/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          echo "$ARCHIVE_SHA256  candidate.zip" | shasum -a 256 -c -
          arm=SporTagLytics-0.17.39-arm64.dmg
          intel=SporTagLytics-0.17.39-x64.dmg
          unzip -q candidate.zip "$arm" SHA256SUMS.txt release-verification.json
          jq -e --arg head "$EXPECTED_MAIN" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" '.version=="0.17.39" and .sourceCommit==$head and .workflowRun==$run and (.macos|length)==2 and all(.macos[]; .notarized and .stapled and .gatekeeperAccepted and .payloadCompared)' release-verification.json
          for dmg in "$arm" "$intel"; do
            expected=$(jq -er --arg name "$dmg" '.assets[$name]' release-verification.json)
            listed=$(awk -v file="$dmg" '$2==file {print $1}' SHA256SUMS.txt)
            test "$expected" = "$listed"
            if test "$dmg" = "$arm"; then actual=$(shasum -a 256 "$dmg" | cut -d' ' -f1); else actual=$(unzip -p candidate.zip "$dmg" | shasum -a 256 | cut -d' ' -f1); fi
            test "$actual" = "$expected"
            echo "$actual  $dmg"
          done
          gh release download v0.17.36 -R "$GITHUB_REPOSITORY" --pattern SporTagLytics-0.17.36-arm64.dmg
          echo '246cec4b8529da71d9ad3f2a910c915a3e731dbf918f39a97fa729558887b05c  SporTagLytics-0.17.36-arm64.dmg' | shasum -a 256 -c -
      - name: Verify both arm64 applications and install the older app
        run: |
          set -eu -o pipefail
          cd "$RUNNER_TEMP"
          mkdir old-volume signed test-Applications
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/old-volume" SporTagLytics-0.17.36-arm64.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/signed" SporTagLytics-0.17.39-arm64.dmg
          for dir in old-volume signed; do
            app="$RUNNER_TEMP/$dir/SporTagLytics.app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess -vv --type execute "$app"
          done
          ditto "$RUNNER_TEMP/old-volume/SporTagLytics.app" "$RUNNER_TEMP/test-Applications/SporTagLytics.app"
      - name: Run both signed apps with real files and the isolated update profile
        run: node scripts/verify-signed-01739-update.mjs
      - name: Preserve the observations and release identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-document-update-evidence
          if-no-files-found: warn
          path: |
            update-results/document-check.json
            ${{ runner.temp }}/release-verification.json
            ${{ runner.temp }}/candidate-artifact.json
