name: video-sync-e2e

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/features/videoPlayer/**"
      - "src/types/video/**"
      - "src/types/package/**"
      - "electron/src/ipc/**"
      - "electron/src/mediaTools.ts"
      - "scripts/e2e-clip-sync.mjs"
      - "scripts/media-tool-paths.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/video-sync-e2e.yml"
  workflow_dispatch:

jobs:
  clip-sync-e2e:
    name: Clip synchronization E2E
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run clip synchronization E2E
        run: pnpm run test:e2e:clip-sync
