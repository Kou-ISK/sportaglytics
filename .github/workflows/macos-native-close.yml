name: macOS native close

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/macos-native-close.yml'
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite*.ts'

permissions:
  contents: read

jobs:
  close:
    name: Verify native macOS close and quit
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - run: pnpm install --frozen-lockfile
      - name: Verify held publication contract before media build
        run: pnpm exec vitest run electron/src/testing/nativeFixtureCompilation.test.ts electron/src/ipc/exportHeldPublish.test.ts
      - name: Build verified host media tools
        run: pnpm run media:build
      - name: Build application and preload
        run: |
          pnpm run e2e:prepare
          test ! -e build/electron/src/testing/nativeFixtureCompilation.js
      - name: Verify measured export text with macOS fonts
        run: |
          node scripts/test-export-text-layout.mjs
          node scripts/e2e-export-text-geometry.mjs
      - name: Verify native close and quit persistence
        run: node scripts/e2e-timeline-close.mjs
      - name: Verify timeline row and selection interactions
        run: node scripts/e2e-timeline-rows.mjs
      - name: Check persisted embedded clip shortcut delivery
        run: |
          pnpm run native:build
          pnpm run test:native-runtime
          node scripts/e2e-clip-sync.mjs
      - name: Compare live capture on the two immutable release tags
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.17.31:refs/tags/v0.17.31 refs/tags/v0.17.32:refs/tags/v0.17.32
          test "$(git rev-parse 'v0.17.31^{commit}')" = 14f69336085954f9f454e92aab7ef7e2ce11d4f7
          test "$(git rev-parse 'v0.17.32^{commit}')" = 30774852464e3f344635a24eb93ed8e22855b7f7
          test "$(git rev-parse v0.17.31:pnpm-lock.yaml)" = "$(git rev-parse v0.17.32:pnpm-lock.yaml)"
          test "$(git rev-parse v0.17.31:scripts/e2e-live-capture.mjs)" = "$(git rev-parse v0.17.32:scripts/e2e-live-capture.mjs)"
          result=0
          for tag in v0.17.31 v0.17.32; do
            fixture=$(mktemp -d "$RUNNER_TEMP/compare-capture.XXXXXXXX")
            git archive "$tag" | tar xf - -C "$fixture"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$fixture/node_modules"
            ln -s "$GITHUB_WORKSPACE/.cache" "$fixture/.cache"
            cp scripts/e2e-live-capture.mjs "$fixture/scripts/e2e-live-capture.mjs"
            (cd "$fixture" && pnpm run e2e:prepare && node scripts/e2e-live-capture.mjs) || result=1
            echo "Completed capture comparison $tag"
          done
          exit "$result"
