name: Refresh 0.8.3 Lockfile

on:
  push:
    branches:
      - fix/security-audit-0.8.3

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/security-audit-0.8.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify audit
        run: pnpm audit && pnpm audit --prod

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore: refresh lockfile for security overrides [skip ci]"
          git push
